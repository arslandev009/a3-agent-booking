# Standalone repo: this project is the repository root (one repo per project).
name: a3-agent-booking
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "Install (no API keys and no llm-client needed, tests use a scripted fake LLM)"
        run: pip install -e ".[api,dev]"
      - name: Unit + API tests
        run: python -m pytest -q
      - name: Scenario files are in sync with the generator
        run: |
          python scripts/make_scenarios.py
          git diff --exit-code -- data/eval
